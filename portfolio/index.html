<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--artifact-start-->
<title>物語のある一枚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #edefea;
    --surface: #f8f9f6;
    --ink: #1b211e;
    --muted: #5b655f;
    --line: #d0d6ce;
    --accent: #2e5e4e;
    --accent-ink: #f4f7f3;
    --shade: rgba(20, 28, 24, .10);
    --scrim: rgba(12, 16, 14, .92);
    --display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #131715;
      --surface: #1b201d;
      --ink: #e7ebe6;
      --muted: #9aa49d;
      --line: #2d3430;
      --accent: #8fc5b0;
      --accent-ink: #10231c;
      --shade: rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #131715;
    --surface: #1b201d;
    --ink: #e7ebe6;
    --muted: #9aa49d;
    --line: #2d3430;
    --accent: #8fc5b0;
    --accent-ink: #10231c;
    --shade: rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 15px/1.8 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; display: block; }
  .wrap { max-width: 1240px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 48px); }

  /* ---------- header ---------- */
  header.intro {
    padding-block: clamp(40px, 8vw, 96px) clamp(28px, 5vw, 56px);
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
    gap: clamp(24px, 5vw, 72px);
    align-items: end;
  }
  .eyebrow {
    font: 500 12px/1 var(--mono);
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 20px;
  }
  h1 {
    font: 900 clamp(44px, 8.4vw, 104px)/1.08 var(--display);
    letter-spacing: .02em;
    margin: 0;
    text-wrap: balance;
  }
  h1 .latin {
    display: block;
    margin-top: 14px;
    font: 500 clamp(14px, 1.6vw, 18px)/1.4 var(--mono);
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .lead { margin: 0; max-width: 34em; color: var(--muted); }
  .lead strong { color: var(--ink); font-weight: 500; }
  .tally {
    display: flex; gap: 28px; margin-top: 24px;
    font: 400 12px/1.3 var(--mono); color: var(--muted);
    letter-spacing: .06em;
  }
  .tally b {
    display: block; font: 700 30px/1 var(--display);
    color: var(--ink); letter-spacing: 0; margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- filter ---------- */
  .filters {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--bg);
    border-block: 1px solid var(--line);
    padding-block: 12px;
  }
  .filters .wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip {
    appearance: none; cursor: pointer;
    font: 500 13px/1 var(--body);
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 14px;
    display: inline-flex; gap: 8px; align-items: center;
    transition: background .15s, border-color .15s, color .15s;
  }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip .n { font: 400 11px/1 var(--mono); opacity: .7; }
  .chip:focus-visible, .work button:focus-visible, .lb button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 3px;
  }

  /* ---------- gallery ---------- */
  main { padding-block: clamp(28px, 4vw, 48px) 96px; }
  .grid { columns: 3 300px; column-gap: clamp(18px, 2.4vw, 32px); }
  .work {
    break-inside: avoid;
    margin: 0 0 clamp(28px, 3.6vw, 48px);
    display: flex; flex-direction: column; gap: 14px;
  }
  .work .frame {
    appearance: none; border: 0; padding: 0; margin: 0; cursor: zoom-in;
    background: var(--surface);
    display: block; width: 100%;
    box-shadow: 0 1px 2px var(--shade), 0 10px 28px -12px var(--shade);
    overflow: hidden;
  }
  .work .frame img {
    width: 100%; height: auto;
    transition: transform .5s cubic-bezier(.2, .7, .2, 1);
  }
  .work .frame:hover img { transform: scale(1.025); }
  .work .cuts { display: flex; gap: 8px; }
  .work .cuts button {
    appearance: none; border: 1px solid var(--line); padding: 0; margin: 0; cursor: zoom-in;
    background: var(--surface); width: 64px; height: 44px; overflow: hidden; flex: none;
  }
  .work .cuts button img { width: 100%; height: 100%; object-fit: cover; }
  .work .cuts button[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .work .cuts .label {
    align-self: center; font: 400 11px/1.4 var(--mono); color: var(--muted); letter-spacing: .06em;
  }
  .meta { display: grid; grid-template-columns: auto 1fr; column-gap: 14px; row-gap: 6px; }
  .meta .no {
    grid-row: span 2;
    font: 500 12px/1 var(--mono); color: var(--accent);
    padding-top: 7px; letter-spacing: .04em;
  }
  .meta h2 { font: 700 20px/1.45 var(--display); margin: 0; text-wrap: balance; }
  .meta .tags {
    font: 400 11px/1.5 var(--mono); color: var(--muted); letter-spacing: .04em;
    display: flex; flex-wrap: wrap; gap: 4px 12px;
  }
  .meta p { grid-column: 2; margin: 4px 0 0; font-size: 14px; line-height: 1.85; color: var(--muted); }
  .work[hidden] { display: none !important; }

  footer {
    border-top: 1px solid var(--line);
    padding-block: 28px 48px;
    font: 400 12px/1.7 var(--mono); color: var(--muted); letter-spacing: .03em;
  }
  footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }

  /* ---------- lightbox ---------- */
  .lb {
    position: fixed; inset: 0; z-index: 50;
    background: var(--scrim);
    display: grid; grid-template-rows: auto 1fr auto;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    color: #eef1ed;
  }
  .lb[hidden] { display: none !important; }
  .lb .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 400 12px/1 var(--mono); letter-spacing: .08em; color: #b8c1bb; }
  .lb .stage { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; min-height: 0; padding-block: 12px; }
  .lb .stage img { max-height: calc(100vh - 190px); max-height: calc(100dvh - 190px); width: auto; margin: 0 auto; object-fit: contain; }
  .lb button {
    appearance: none; background: transparent; color: inherit; cursor: pointer;
    border: 1px solid rgba(255,255,255,.25); border-radius: 999px;
    font: 500 13px/1 var(--mono); padding: 10px 14px;
  }
  .lb button:hover { border-color: rgba(255,255,255,.6); }
  .lb .cap { text-align: center; max-width: 60ch; margin: 0 auto; }
  .lb .cap h3 { font: 700 18px/1.4 var(--display); margin: 0 0 4px; }
  .lb .cap span { font: 400 11px/1.4 var(--mono); color: #b8c1bb; letter-spacing: .05em; }

  @media (max-width: 760px) {
    header.intro { grid-template-columns: 1fr; align-items: start; }
    .lb .stage { grid-template-columns: 1fr; }
    .lb .stage .nav { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="wrap intro">
  <div>
    <p class="eyebrow">Portfolio · Generative Image Works · 2026</p>
    <h1>物語のある一枚<span class="latin">Stories in Frames</span></h1>
  </div>
  <div>
    <p class="lead">画像生成AIで制作した<strong>広告ビジュアル・店舗イメージ・キャラクター作品・図解エッセイ</strong>をまとめました。どの作品も、一枚の中に「その前後の時間」が感じられるよう、場所・小物・表情まで設計しています。</p>
    <div class="tally" aria-label="収録数">

      <span><b id="t-images">27</b>カット</span>

    </div>
  </div>
</header>

<nav class="filters" aria-label="カテゴリで絞り込む">
  <div class="wrap" id="filters"></div>
</nav>

<main class="wrap">
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="wrap">

    <span>© 2026 Stories in Frames</span>
  </div>
</footer>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="作品を拡大表示">
  <div class="bar">
    <span id="lb-count"></span>
    <button type="button" id="lb-close">閉じる ✕</button>
  </div>
  <div class="stage">
    <button type="button" class="nav" id="lb-prev" aria-label="前の画像">←</button>
    <img id="lb-img" alt="">

  </div>
  <div class="cap">

    <span id="lb-meta"></span>
  </div>
</div>

  function ratio(w, h) {
    var r = w / h;
    if (Math.abs(r - 1) < .03) return "1:1";
    if (Math.abs(r - 16 / 9) < .03) return "16:9";
    if (Math.abs(r - 4 / 5) < .03) return "4:5";
    if (Math.abs(r - 2 / 3) < .03) return "2:3";
    if (Math.abs(r - 3 / 4) < .03) return "3:4";
    if (Math.abs(r - 5 / 4) < .03) return "5:4";
    return r.toFixed(2) + ":1";
  }
  function el(tag, attrs, kids) {

    for (var k in attrs || {}) {

      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

        var b = el("button", {
          type: "button", "aria-label": w.title + "：" + c.cap,
          "aria-current": ci === 0 ? "true" : "false"
        }, [el("img", { src: c.src, alt: "", loading: "lazy" })]);
        b.addEventListener("click", function () {
          card._cut = ci;
          mainImg.src = c.src; mainImg.width = c.w; mainImg.height = c.h;
          mainImg.alt = w.title + "（" + c.cap + "）";
          cuts.querySelectorAll("button").forEach(function (x, xi) {
            x.setAttribute("aria-current", xi === ci ? "true" : "false");
          });
        });
        cuts.appendChild(b);
      });
      cuts.appendChild(el("span", { class: "label", text: w.cuts.length + " カット · " + w.cuts.map(function (c) { return c.cap; }).join(" / ") }));
    }

    var dims = w.cuts.map(function (c) { return c.w + "×" + c.h; }).join(" / ");
    var tags = el("div", { class: "tags" }, [
      el("span", { text: CATS[w.cat] }),
      el("span", { text: dims + " px" }),
      el("span", { text: ratio(first.w, first.h) })
    ]);
    var meta = el("div", { class: "meta" }, [
      el("span", { class: "no", text: "N° " + w.no }),
      el("h2", { text: w.title }),
      tags,
      el("p", { text: w.desc })
    ]);
    var card = el("article", { class: "work", "data-cat": w.cat }, [frame, cuts, meta]);
    cards.push(card);
    grid.appendChild(card);
  });

  // tally
  document.getElementById("t-works").textContent = WORKS.length;
  document.getElementById("t-images").textContent = FLAT.length;
  document.getElementById("t-series").textContent = WORKS.filter(function (w) { return w.cuts.length > 1; }).length;

  // filters
  var filters = document.getElementById("filters");
  var current = "all";
  function count(cat) {
    return cat === "all" ? WORKS.length : WORKS.filter(function (w) { return w.cat === cat; }).length;
  }
  function setFilter(cat) {
    current = cat;
    filters.querySelectorAll(".chip").forEach(function (c) {
      c.setAttribute("aria-pressed", c.dataset.cat === cat ? "true" : "false");
    });
    cards.forEach(function (card) { card.hidden = !(cat === "all" || card.dataset.cat === cat); });
    try { localStorage.setItem("sif-filter", cat); } catch (e) {}
  }
  [["all", "すべて"]].concat(Object.keys(CATS).map(function (k) { return [k, CATS[k]]; })).forEach(function (pair) {
    var b = el("button", { type: "button", class: "chip", "data-cat": pair[0], "aria-pressed": "false" }, [
      el("span", { text: pair[1] }), el("span", { class: "n", text: String(count(pair[0])) })
    ]);
    b.addEventListener("click", function () { setFilter(pair[0]); });
    filters.appendChild(b);
  });
  var saved = "all";
  try { saved = localStorage.getItem("sif-filter") || "all"; } catch (e) {}
  setFilter(CATS[saved] ? saved : "all");

  // lightbox
  var lb = document.getElementById("lb");
  var lbImg = document.getElementById("lb-img");
  var pos = 0, lastFocus = null;
  function visibleFlat() {
    return FLAT.filter(function (f) { return current === "all" || WORKS[f.wi].cat === current; });
  }
  function show() {
    var list = visibleFlat();
    var f = list[pos], w = WORKS[f.wi], c = w.cuts[f.ci];
    lbImg.src = c.src;
    lbImg.alt = w.title + (c.cap ? "（" + c.cap + "）" : "");
    document.getElementById("lb-title").textContent = w.title + (c.cap ? " — " + c.cap : "");
    document.getElementById("lb-meta").textContent = "N° " + w.no + " · " + CATS[w.cat] + " · " + c.w + "×" + c.h + " px";
    document.getElementById("lb-count").textContent = String(pos + 1).padStart(2, "0") + " / " + String(list.length).padStart(2, "0");
  }
  function open(wi, ci) {
    var list = visibleFlat();
    pos = Math.max(0, list.findIndex(function (f) { return f.wi === wi && f.ci === ci; }));
    lastFocus = document.activeElement;
    lb.hidden = false;
    document.body.style.overflow = "hidden";
    show();
    document.getElementById("lb-close").focus();
  }
  function close() {
    lb.hidden = true;
    document.body.style.overflow = "";
    if (lastFocus) lastFocus.focus();
  }
  function step(d) {
    var n = visibleFlat().length;
    pos = (pos + d + n) % n;
    show();
  }
  document.getElementById("lb-close").addEventListener("click", close);
  document.getElementById("lb-prev").addEventListener("click", function () { step(-1); });
  document.getElementById("lb-next").addEventListener("click", function () { step(1); });
  lb.addEventListener("click", function (e) { if (e.target === lb || e.target.classList.contains("stage")) close(); });
  document.addEventListener("keydown", function (e) {
    if (lb.hidden) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
  });
  // swipe on touch screens
  var sx = null;
  lb.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
    sx = null;
  });
})();
</script>
<!--artifact-end-->
</body>
</html>
